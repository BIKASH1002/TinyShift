name: TinyShift checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_test_only_not_a_real_key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/check-repository.mjs
      - run: node scripts/test-release.mjs
      - run: node scripts/test-user-messages.mjs
      - run: node scripts/test-data-cache.mjs
      - run: node scripts/test-routines.mjs
      - run: node scripts/test-ai.mjs
      - run: node scripts/test-weekly-ai.mjs
      - run: node scripts/test-adjustment-ai.mjs
      - run: node scripts/test-account.mjs
      - run: node scripts/test-rescue-coach.mjs
      - run: node scripts/test-push.mjs
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node node_modules/vite/bin/vite.js build
      - name: Install PostgreSQL for isolated database checks
        run: sudo apt-get update && sudo apt-get install --yes postgresql-16 postgresql-client-16
      - run: sh scripts/test-database.sh
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Isolated responsive UI checks
        env:
          TINYSHIFT_TEST_PROJECT_REF: example
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 3017 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3017/ > /dev/null; then break; fi
            sleep 1
          done
          python scripts/test-ui.py
